name: Check native SDK
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev pkg-config
      - run: sudo sh build.sh
      - run: python3 -m compileall -q python tests
